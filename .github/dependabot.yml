version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must stay on the same release: a newer init writes a
      # config file an older analyze refuses to load.
      codeql-action:
        patterns:
          - "github/codeql-action*"
